[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
# Oldest toolchain the code (and its tests) builds with; CI uses latest stable.
rust-version = "1.90"

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
ts-rs = "12"
tempfile = "3"

# Every crate opts in with `[lints] workspace = true`. CI runs clippy with
# `-D warnings`, so a pedantic finding fails the build.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
