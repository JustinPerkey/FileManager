[package]
name = "filemanager-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "fm_app"
path = "src/lib.rs"

[[bin]]
name = "filemanager-gpui"
path = "src/main.rs"

# The screenshot harness. Never part of the release exe: it needs the `shoot`
# feature, which turns on GPUI's test-support.
[[bin]]
name = "filemanager-shoot"
path = "src/bin/filemanager-shoot.rs"
required-features = ["shoot"]

[features]
default = []
shoot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
fm-core = { path = "../../crates/fm-core" }
fm-dbmanager = { path = "../../crates/fm-dbmanager" }
fm-pipeline = { path = "../../crates/fm-pipeline" }
fm-schedule = { path = "../../crates/fm-schedule" }
fm-tarpack = { path = "../../crates/fm-tarpack" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-kit-assets = { workspace = true }
async-channel = { workspace = true }
directories = { workspace = true }
log = { workspace = true }
image = { workspace = true, optional = true }

[dev-dependencies]
# test-support must stay a dev-dependency feature: it must not reach the exe.
gpui = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
