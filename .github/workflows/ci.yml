name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - run: npm run build -w apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: fm-* crates must not depend on tauri
        shell: bash
        run: |
          set -uo pipefail
          for c in fm-core fm-tarpack; do
            if ! cargo pkgid --locked -p "$c" >/dev/null; then
              echo "::error::no workspace package named $c"; exit 1
            fi
            if out=$(cargo tree --locked -p "$c" -i tauri -e normal,build,dev 2>&1); then
              echo "::error::$c depends on tauri"; echo "$out"; exit 1
            fi
            if ! grep -q "did not match any packages" <<<"$out"; then
              echo "::error::unexpected cargo tree failure for $c"; echo "$out"; exit 1
            fi
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/desktop
      - run: cargo test --workspace --locked
      - run: npm run tauri:build
      - name: Exe must import no C runtime, zstd, liblzma, or WebView2Loader DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $out = (& $dumpbin /dependents target\release\filemanager.exe | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin failed"; exit 1 }
          if ($out -notmatch '(?i)KERNEL32\.dll') { Write-Error "dumpbin output looks wrong"; exit 1 }
          $bad = [regex]::Matches($out, '(?im)^\s*(vcruntime\S*\.dll|msvcp\S*\.dll|api-ms-win-crt-\S*|zstd\S*\.dll|liblzma\S*\.dll|WebView2Loader\.dll)\s*$')
          if ($bad.Count -gt 0) {
            Write-Error ("Forbidden dependencies: " + (($bad | ForEach-Object { $_.Value.Trim() }) -join ', '))
            exit 1
          }
      - name: Stage artifact (exe only, no .pdb)
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-artifact | Out-Null
          Copy-Item target\release\filemanager.exe "dist-artifact\FileManager-$v-x64.exe"
          "ARTIFACT_NAME=FileManager-$v-x64.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist-artifact/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
