name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - run: npm run build -w apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Both test steps share one temp data folder; afterwards it must hold no
      # FileManager folder. (apps/desktop/src-tauri/src/tools/tarpack/mod.rs, around
      # line 31, still calls AppDirs::from_system() unguarded; no test reaches it
      # and it is removed at the cutover.)
      - name: Test data folder
        run: echo "XDG_DATA_HOME=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      # The workspace runs above do not build the screenshot harness (feature `shoot`).
      - run: cargo clippy -p filemanager-gpui --features shoot --all-targets --locked -- -D warnings
      - run: cargo test -p filemanager-gpui --features shoot --locked
      - name: Tests must not touch the real user data folder
        run: |
          if [ -e "$XDG_DATA_HOME/FileManager" ]; then
            echo "a test created $XDG_DATA_HOME/FileManager"; exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: fm-* crates must not depend on tauri or the GPUI stack
        shell: bash
        run: |
          set -uo pipefail
          for c in fm-core fm-tarpack fm-schedule fm-pipeline fm-dbmanager; do
            if ! cargo pkgid --locked -p "$c" >/dev/null; then
              echo "::error::no workspace package named $c"; exit 1
            fi
            for dep in tauri gpui-pre gpui-pre-platform gpui-component; do
              if out=$(cargo tree --locked -p "$c" -i "$dep" -e normal,build,dev 2>&1); then
                echo "::error::$c depends on $dep"; echo "$out"; exit 1
              fi
              if ! grep -q "did not match any packages" <<<"$out"; then
                echo "::error::unexpected cargo tree failure for $c / $dep"; echo "$out"; exit 1
              fi
              echo "$c / $dep: not a dependency"
            done
          done

      - name: GPUI test-support must not reach the release graph
        shell: bash
        run: |
          set -uo pipefail
          out=$(cargo tree --locked -p filemanager-gpui -e features,normal,build --target x86_64-pc-windows-msvc -i gpui-pre 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # Positive control: a command that silently matches nothing must not pass.
          if ! grep -q 'gpui-pre feature "default"' <<<"$out"; then
            echo "::error::cargo tree did not report gpui-pre features; the check proves nothing"; exit 1
          fi
          if grep -q "test-support" <<<"$out"; then
            echo "::error::gpui test-support is enabled outside dev-dependencies"; echo "$out"; exit 1
          fi
          # Negative control: with the harness feature the same command must see test-support.
          shoot=$(cargo tree --locked -p filemanager-gpui --features shoot -e features,normal,build --target x86_64-pc-windows-msvc -i gpui-pre 2>&1) || { echo "$shoot"; exit 1; }
          echo "--- with --features shoot ---"
          echo "$shoot"
          if ! grep -q "test-support" <<<"$shoot"; then
            echo "::error::cargo tree did not see test-support with --features shoot; the check cannot detect it"; exit 1
          fi

      - name: rfd must not reach the GPUI app
        shell: bash
        run: |
          # Cargo.lock still holds rfd while apps/desktop exists (tauri-plugin-dialog);
          # only the filemanager-gpui graph matters.
          set -uo pipefail
          out=$(cargo tree --locked -p filemanager-gpui -i rfd --target all 2>&1) || true
          echo "$out"
          if ! grep -q "did not match any packages" <<<"$out"; then
            echo "::error::rfd is in the filemanager-gpui dependency graph (or cargo tree failed)"; exit 1
          fi

  windows:
    # Pinned, never the moving windows-latest: Windows Server 2025 shares the
    # Windows 11 24H2 code base.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/desktop
      # The linux job never compiles #[cfg(windows)] code; lint it here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run tauri:build
      - name: Build the GPUI app (release)
        run: cargo build --release -p filemanager-gpui --locked
      - name: The release build must not contain the screenshot harness
        shell: pwsh
        run: |
          if (Test-Path 'target\release\filemanager-shoot.exe') {
            Write-Error "target\release\filemanager-shoot.exe exists: the harness leaked into the release build"; exit 1
          }
          Write-Host "no filemanager-shoot.exe in target\release"
      - name: Exes must import no C runtime, zstd, liblzma, sqlite3, or WebView2Loader DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          foreach ($exe in 'target\release\filemanager.exe', 'target\release\filemanager-gpui.exe') {
            Write-Host "== $exe"
            $out = (& $dumpbin /dependents $exe | Out-String)
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin failed on $exe"; exit 1 }
            if ($out -notmatch '(?i)KERNEL32\.dll') { Write-Error "dumpbin output looks wrong for $exe"; exit 1 }
            $bad = [regex]::Matches($out, '(?im)^\s*(vcruntime\S*\.dll|msvcp\S*\.dll|api-ms-win-crt-\S*|zstd\S*\.dll|liblzma\S*\.dll|sqlite3\S*\.dll|WebView2Loader\.dll)\s*$')
            if ($bad.Count -gt 0) {
              Write-Error ("Forbidden dependencies in ${exe}: " + (($bad | ForEach-Object { $_.Value.Trim() }) -join ', '))
              exit 1
            }
          }
      - name: GPUI exe runs alone (self-check from an empty folder)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'only-the-exe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\filemanager-gpui.exe $dir
          $p = Start-Process -FilePath "$dir\filemanager-gpui.exe" -ArgumentList '--self-check' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "self-check TIMED OUT"; $code = 124 } else { $code = $p.ExitCode }
          Write-Host "self-check exit code: $code"
          if ($code -ne 0) { exit $code }
      - name: Screenshot harness lint and tests (feature shoot)
        run: |
          cargo clippy -p filemanager-gpui --features shoot --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p filemanager-gpui --features shoot --locked
      - name: Screenshots (the harness twice, compared)
        shell: pwsh
        run: |
          # Dev profile on purpose: it reuses the artifacts of the test build above.
          cargo build -p filemanager-gpui --features shoot --bin filemanager-shoot --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force shots | Out-Null
          $failed = $false
          foreach ($run in 'run1', 'run2') {
            & target\debug\filemanager-shoot.exe --out "shots\$run"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          # A difference between the runs is reported, never failed.
          $lines = @()
          foreach ($f in Get-ChildItem shots\run1 -Filter *.png -ErrorAction SilentlyContinue) {
            $other = Join-Path shots\run2 $f.Name
            if (-not (Test-Path $other)) { $lines += "MISSING in run2: $($f.Name)"; continue }
            $a = (Get-FileHash $f.FullName).Hash
            $b = (Get-FileHash $other).Hash
            if ($a -eq $b) { $lines += "identical: $($f.Name)" } else { $lines += "DIFFERENT: $($f.Name)" }
          }
          if ($lines.Count -eq 0) { $lines += "no screenshots were written" }
          $lines | Set-Content shots\determinism.txt
          $lines | ForEach-Object { Write-Host $_ }
          # A scenario that fails to run does fail the job.
          if ($failed) { Write-Error "a screenshot scenario failed"; exit 1 }
          # Negative control: an unknown scenario must make the harness exit non-zero.
          & target\debug\filemanager-shoot.exe --out shots\none --only no-such
          Write-Host "exit code for --only no-such: $LASTEXITCODE"
          if ($LASTEXITCODE -eq 0) { Write-Error "the harness exited 0 for an unknown scenario"; exit 1 }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
      - name: Stage artifact (exe only, no .pdb)
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-artifact | Out-Null
          Copy-Item target\release\filemanager.exe "dist-artifact\FileManager-$v-x64.exe"
          "ARTIFACT_NAME=FileManager-$v-x64.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Copy-Item target\release\filemanager-gpui.exe "dist-artifact\FileManager-gpui-$v-x64.exe"
          "GPUI_ARTIFACT_NAME=FileManager-gpui-$v-x64.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist-artifact/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GPUI_ARTIFACT_NAME }}
          path: dist-artifact/${{ env.GPUI_ARTIFACT_NAME }}
          if-no-files-found: error
